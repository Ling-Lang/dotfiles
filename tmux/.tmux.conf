# ==========================================
# 1. BASIS EINSTELLUNGEN
# ==========================================

# Prefix ändern: Von C-b auf C-a (wie GNU Screen)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Maus-Support aktivieren (Scrollen, Resizen, Auswählen)
set -g mouse on

# Farben & Performance
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -s escape-time 0      # WICHTIG für Vim: Entfernt Verzögerung bei ESC
set -g history-limit 10000
set -g focus-events on

# Fenster-Namen nicht automatisch umbenennen (verhindert Chaos)
set-option -g allow-rename off

# ==========================================
# 2. KEYBINDINGS
# ==========================================

# Config Reload mit 'r'
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split Commands (Native Lösung)
# Öffnet neue Panes im gleichen Pfad wie das aktuelle!
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Alte Split-Keys entfernen
unbind '"'
unbind %

# Navigation mit Alt + Pfeiltasten (Ohne Prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ==========================================
# 3. STATUSBAR (Minimalistisch & Plugin-frei)
# ==========================================

# Position: Oben
set -g status-position top

# Farben: Transparent/Dunkelgrau Hintergrund, Blauer Text
set -g status-style bg=default,fg=blue

# Links: Session Name
set -g status-left-length 20
set -g status-left "[#S] "

# Mitte: Fensterliste
# Inaktive Fenster: grau
set-window-option -g window-status-style fg=colour244
set-window-option -g window-status-format " #I:#W "

# Aktives Fenster: blau & fett, in Klammern
set-window-option -g window-status-current-style fg=blue,bold
set-window-option -g window-status-current-format "[#I:#W]"

# Rechts: Hostname & Uhrzeit
# Zeigt rotes "PREFIX" an, wenn du Strg+a drückst
set -g status-right "#{?client_prefix,#[fg=red]PREFIX ,}#[fg=green]#H #[fg=white]%H:%M"
