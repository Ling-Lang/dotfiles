# --- Prefix ändern (Strg+a statt Strg+b) ---
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# --- Split Commands (| und -) ---
# Wir nutzen den aktuellen Pfad für neue Splits
bind-key | run-shell "~/.tmux/plugins/tmux-ssh-split/scripts/tmux-ssh-split.sh -h -c #{pane_current_path}"
bind-key - run-shell "~/.tmux/plugins/tmux-ssh-split/scripts/tmux-ssh-split.sh -v -c #{pane_current_path}"
#bind | split-window -h -c "#{pane_current_path}"
#bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Config Reload (mit r) ---
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# --- Navigation ohne Prefix (Alt + Pfeiltasten) ---
set-window-option -g xterm-keys on
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n S-Right next-window
bind -n S-Left previous-window
# --- Mausunterstützung (optional, aber sehr nützlich) ---
set -g mouse on

# --- Farben korrekt setzen (WICHTIG für Themes) ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides "xterm-256color:RGB"

# --- Namen behalten ---
set-option -g allow-rename off
set-option -sg escape-time 10
set-option -g focus-events on
# ==========================================
# PLUGINS
# ==========================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @compile-mode-height "15%"
set -g @plugin 'erikw/tmux-powerline'
set -g @plugin 'pschmitt/tmux-ssh-split'
set-window-option -g window-status-style bg=default,fg=blue
set-window-option -g window-status-current-style bg=blue,fg=black,bold
set -g @ssh-split-keep-cwd "true"
set -g @ssh-split-fail "false"
# --- Catppuccin Einstellungen ---

set -g @catppuccin_flavor 'macchiato' # Korrigiert: macchiato
set -g @catppuccin_window_default_text "  #W"
set -g @catppuccin_window_current_text "  #W"
set -g @catppuccin_window_status "icon"
set -g @catppuccin_window_current_fill "number"
# Statusleiste oben oder unten? (Optional)
set -g status-position top
set -g @plugin 'alexekdahl/tmux-compile'
# Initialisiere TPM (Muss ganz unten stehen!)
run '~/.tmux/plugins/tpm/tpm'
